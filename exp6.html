<!DOCTYPE html>
<html>
<body>

<h1>The iframe element + CSS</h1>

<p>An iframe with default borders:</p>
<iframe src="/default.asp" width="90%" height="100">
</iframe>

<p>An iframe with a thin black border:</p>
<iframe src="/default.asp" width="90%" height="100" style="border:1px solid black;">
</iframe>

<p>An iframe with a thin black border:</p>
<iframe src="/default.asp" width="90%" height="100" style="border:1px solid black;">
</iframe>

<p>An iframe with no borders:</p>
<iframe src="/default.asp" width="90%" height="100" style="border:none;">
</iframe>

</body>
</html>
