<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 1px solid #666;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #9ACD32; /* light green */
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Students</h1>

    <table>
        <tr>
            <th>Roll No</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Nick Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Prathamesh</td>
            <td>Khavare</td>
            <td>Tiger</td>
            <td>95</td>
        </tr>

        <tr>
            <td>593</td>
            <td>Yash</td>
            <td>Mane</td>
            <td>Lion</td>
            <td>90</td>
        </tr>
    </table>

</body>
</html>
