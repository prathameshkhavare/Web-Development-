<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML List Tags Example</title>
</head>
<body>

    <h1>HTML List Tags</h1>

    
    <h2>Unordered List (ul)</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>

    
    <h2>Ordered List (ol)</h2>
    <ol>
        <li>Wake up</li>
        <li>Brush teeth</li>
        <li>Go to school</li>
    </ol>

    
    <h2>Description List (dl)</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>

        <dt>JavaScript</dt>
        <dd>A scripting language for web pages</dd>
    </dl>

</body>
</html>
